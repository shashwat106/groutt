[project]
name = "industryos"
version = "0.1.0"
description = "Grout: an MCP server that gives any AI app the brain of a small manufacturing business."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "fastmcp>=2,<3",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
